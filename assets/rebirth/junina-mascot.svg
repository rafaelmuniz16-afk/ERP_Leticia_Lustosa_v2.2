<svg xmlns="http://www.w3.org/2000/svg" width="260" height="286" viewBox="0 0 260 286" fill="none" role="img" aria-labelledby="j-title j-desc">
<title id="j-title">Milhozinho do Forró, mascote do Arraiá</title>
<desc id="j-desc">Milho sorridente de chapéu de palha com costura xadrez, lenço azul e sanfona vermelha, dançando forró com botas e mãos pequeninas. Ilustração vetorial de fundo transparente.</desc>
