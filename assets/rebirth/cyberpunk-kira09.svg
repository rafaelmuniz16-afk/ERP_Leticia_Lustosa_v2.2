<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 260" role="img" aria-labelledby="title desc">
<title id="title">KIRA-09, a raposa holográfica Cyberpunk</title><desc id="desc">Mascote holográfico original com orelhas triangulares, olhos ciano luminosos e circuitos magenta</desc>
<defs>
 <linearGradient id="shell" x1=".1" y1=".06" x2=".96" y2=".95"><stop stop-color="#263a65"/><stop offset=".48" stop-color="#141c3c"/><stop offset="1" stop-color="#10132a"/></linearGradient>
 <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#99faff"/><stop offset=".45" stop-color="#36cce8"/><stop offset=".74" stop-color="#b979ff"/><stop offset="1" stop-color="#ff5ac5"/></linearGradient>
 <linearGradient id="ear" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#ee58e6"/><stop offset="1" stop-color="#672fac"/></linearGradient>
 <linearGradient id="visor" x1=".08" y1=".1" x2=".92" y2=".9"><stop stop-color="#12364f"/><stop offset=".65" stop-color="#0b152b"/><stop offset="1" stop-color="#26193d"/></linearGradient>
 <radialGradient id="light"><stop stop-color="#bafcff" stop-opacity=".55"/><stop offset="1" stop-color="#00c4ff" stop-opacity="0"/></radialGradient>
 <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="soft"><feGaussianBlur stdDeviation="7"/></filter>
</defs>
<!-- Floating data sparks, not a solid rectangular backdrop. -->
<g fill="none" stroke="#4bf5ff" stroke-width="1.5" opacity=".8"><path d="M29 79l-7 5 7 5M205 62l7 5-7 5"/><path d="M207 174h12m-6-6v12" stroke="#fb70db"/><circle cx="35" cy="181" r="3"/><circle cx="203" cy="111" r="2.5" fill="#8ceaff"/></g>
<ellipse cx="120" cy="232" rx="76" ry="11" fill="#53e8ff" opacity=".16" filter="url(#soft)"/>
<!-- Sleek antenna and fox ears -->
<path d="M111 63V29m0 0 8-11 8 11-8 10" fill="none" stroke="#75f6ff" stroke-width="3" stroke-linejoin="round"/>
<circle cx="119" cy="18" r="5" fill="#a9fdff" filter="url(#glow)"/>
<path d="M60 98 48 27q0-7 6-7l54 43M180 98l12-71q0-7-6-7l-54 43" fill="url(#shell)" stroke="url(#edge)" stroke-width="5" stroke-linejoin="round"/>
<path d="M67 72 60 36l34 30M173 72l7-36-34 30" fill="url(#ear)" opacity=".94"/>
<path d="M51 42 73 67M189 42l-22 25" stroke="#80faff" stroke-width="2" opacity=".8"/>
<!-- Body neck plating -->
<path d="M82 179q-23 18-20 39 31 21 58 21t58-21q3-21-20-39" fill="url(#shell)" stroke="#69deff" stroke-width="4"/>
<path d="M85 203h70l-6 21h-58Z" fill="#132640" stroke="#b56fff" stroke-width="2"/><path d="m109 211 10 8 12-8-12-7Z" fill="#4eecff" filter="url(#glow)"/>
<path d="M72 204 83 212M169 204l-11 8" stroke="#fc67ce" stroke-width="3" stroke-linecap="round"/>
<!-- Face shell in pet-like proportions -->
<path d="M57 84q14-39 63-41 50 2 64 41l7 57q-5 51-71 58-65-7-71-58Z" fill="url(#shell)" stroke="url(#edge)" stroke-width="5"/>
<path d="M74 90q46-32 92 0" stroke="#778cbd" stroke-width="3" opacity=".7" fill="none"/>
<!-- Neon cheek circuitry -->
<path d="M59 128h14l11 13m97-13h-14l-11 13" fill="none" stroke="#ff66d0" stroke-width="3" stroke-linejoin="round"/>
<circle cx="78" cy="139" r="3" fill="#fca0fc"/><circle cx="162" cy="139" r="3" fill="#fca0fc"/>
<path d="M62 157q14 20 28 21M178 157q-14 20-28 21" fill="none" stroke="#73e9ff" opacity=".57" stroke-width="2"/>
<!-- Visor: gleaming eyes -->
<path d="M74 104q46-21 92 0l7 34q-53 22-106 0Z" fill="url(#visor)" stroke="#46dff0" stroke-width="2.8"/>
<ellipse cx="96" cy="119" rx="22" ry="19" fill="url(#light)"/><ellipse cx="145" cy="119" rx="22" ry="19" fill="url(#light)"/>
<path d="M80 122q16-17 31 1M129 123q16-17 31-1" fill="none" stroke="#96ffff" stroke-width="7" stroke-linecap="round" filter="url(#glow)"/>
<path d="M90 114h8M141 114h8" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
<!-- Cute fox snout details -->
<path d="M111 151q9 6 18 0l-9 12Z" fill="#ff88d9"/><path d="M120 162v7m0 0q-8 6-14-1m14 1q8 6 14-1" stroke="#b8faff" stroke-width="2.2" fill="none" stroke-linecap="round"/>
<g fill="#ee79df" opacity=".55"><ellipse cx="82" cy="154" rx="9" ry="4"/><ellipse cx="158" cy="154" rx="9" ry="4"/></g>
<!-- Side processors -->
<rect x="39" y="117" width="16" height="32" rx="7" fill="#1a2748" stroke="#bf6bfa" stroke-width="2.6"/><rect x="185" y="117" width="16" height="32" rx="7" fill="#1a2748" stroke="#bf6bfa" stroke-width="2.6"/>
<path d="M42 130h10M188 130h10" stroke="#74f9ff" stroke-width="3"/>
<!-- Tail, curling outside body -->
<path d="M169 211q38-2 42-25 10 17 3 33-14 30-50 20" fill="url(#shell)" stroke="url(#edge)" stroke-width="4"/><path d="M203 204q-6 15-20 18" fill="none" stroke="#ff73d2" stroke-width="3"/>
<g opacity=".8"><circle cx="34" cy="128" r="1.8" fill="#ff91f7"/><circle cx="207" cy="151" r="2" fill="#8efbff"/></g>
</svg>