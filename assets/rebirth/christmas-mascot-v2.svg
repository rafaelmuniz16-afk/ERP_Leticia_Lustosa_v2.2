<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 304" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Papai Noel vetorial premium</title>
  <desc id="desc">Mascote de Natal vetorial, sorridente, com roupa vermelha elegante, barba volumosa, saco de presentes e detalhes dourados.</desc>
  <defs>
    <linearGradient id="coat" x1="88" y1="155" x2="187" y2="264" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff6878"/>
      <stop offset=".44" stop-color="#e02e49"/>
      <stop offset="1" stop-color="#ad1134"/>
    </linearGradient>
    <linearGradient id="cap" x1="82" y1="37" x2="190" y2="95" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff7081"/>
      <stop offset=".48" stop-color="#ea3854"/>
      <stop offset="1" stop-color="#b71439"/>
    </linearGradient>
    <linearGradient id="fur" x1="93" y1="118" x2="161" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8f0f2"/>
    </linearGradient>
    <linearGradient id="skin" x1="95" y1="87" x2="164" y2="153" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffe2cb"/>
      <stop offset=".6" stop-color="#ffd2b6"/>
      <stop offset="1" stop-color="#f1b799"/>
    </linearGradient>
    <linearGradient id="bag" x1="44" y1="135" x2="117" y2="219" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d55a55"/>
      <stop offset="1" stop-color="#8e2f39"/>
    </linearGradient>
    <linearGradient id="gold" x1="112" y1="209" x2="151" y2="239" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff5b4"/>
      <stop offset=".45" stop-color="#ffd35a"/>
      <stop offset="1" stop-color="#de9c1f"/>
    </linearGradient>
    <linearGradient id="boots" x1="89" y1="245" x2="180" y2="278" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5b4959"/>
      <stop offset="1" stop-color="#2f2537"/>
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="260" height="304" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#7e3950" flood-opacity=".22"/>
    </filter>
  </defs>

  <circle cx="45" cy="81" r="5" fill="#ffd768"/>
  <circle cx="212" cy="98" r="4.2" fill="#ffe08c"/>
  <path d="M36 108l4 9 9 4-9 4-4 9-4-9-9-4 9-4 4-9z" fill="#ffd66b"/>
  <path d="M224 116l3 7 7 3-7 3-3 7-3-7-7-3 7-3 3-7z" fill="#ffd66b"/>

  <g filter="url(#shadow)">
    <!-- gift sack behind Santa -->
    <path d="M73 136c-21 2-37 17-43 39-5 20-1 39 11 57 10 15 29 21 52 16 25-6 40-26 43-50 2-21-6-42-24-56-11-9-24-12-39-6z" fill="url(#bag)"/>
    <path d="M49 139c15 7 33 6 47-3" stroke="#f1b3a1" stroke-width="5" stroke-linecap="round" opacity=".55"/>

    <!-- legs and boots -->
    <path d="M101 230h28v33H92v-11c0-10 4-17 9-22z" fill="#fbefe5"/>
    <path d="M135 230h29v33h-37v-11c0-10 3-17 8-22z" fill="#fbefe5"/>
    <path d="M91 248h40v21H77c-3 0-5-3-4-6 4-9 10-15 18-15z" fill="url(#boots)"/>
    <path d="M133 248h39c8 0 15 6 19 15 1 3-1 6-4 6h-54v-21z" fill="url(#boots)"/>

    <!-- sleeves and mittens -->
    <path d="M100 171c-18-6-37 9-44 31l-7 24 36 10 18-43-3-22z" fill="#cd2345"/>
    <path d="M160 170c18-4 36 10 43 31l8 26-36 9-18-43 3-23z" fill="#bf1b40"/>
    <path d="M56 215c0-9 6-15 15-17 8-2 16 2 18 10l-4 18-34-9 5-2z" fill="#fffdf9"/>
    <path d="M205 214c0-9-6-15-15-17-8-2-16 2-18 10l4 18 34-9-5-2z" fill="#fffdf9"/>

    <!-- body -->
    <path d="M97 164c10-9 22-14 33-14 14 0 26 5 35 14 12 11 19 28 19 50v33H76v-33c0-22 9-39 21-50z" fill="url(#coat)"/>
    <path d="M76 237h108v12H76z" fill="#fff9f1"/>
    <path d="M120 150h20v97h-20z" fill="#fff8ef"/>

    <!-- belt -->
    <path d="M77 214h107v20H77z" fill="#402d42"/>
    <rect x="116" y="210" width="29" height="28" rx="6" fill="url(#gold)" stroke="#e6a833" stroke-width="2"/>
    <rect x="123" y="217" width="15" height="14" rx="3" fill="#fffbe0"/>

    <!-- face -->
    <ellipse cx="89" cy="125" rx="11" ry="15" fill="#f2bea8"/>
    <ellipse cx="171" cy="125" rx="11" ry="15" fill="#f2bea8"/>
    <ellipse cx="130" cy="122" rx="46" ry="49" fill="url(#skin)"/>
    <ellipse cx="96" cy="126" rx="11" ry="6" fill="#f39cb0" opacity=".58"/>
    <ellipse cx="164" cy="126" rx="11" ry="6" fill="#f39cb0" opacity=".58"/>
    <path d="M102 109c6-5 13-5 18 0" stroke="#6c5962" stroke-width="4.7" stroke-linecap="round"/>
    <path d="M140 109c6-5 13-5 18 0" stroke="#6c5962" stroke-width="4.7" stroke-linecap="round"/>
    <circle cx="112" cy="117" r="3.9" fill="#43343e"/>
    <circle cx="149" cy="117" r="3.9" fill="#43343e"/>
    <circle cx="113.2" cy="115.8" r="1.1" fill="#fff"/>
    <circle cx="150.2" cy="115.8" r="1.1" fill="#fff"/>
    <ellipse cx="130" cy="129" rx="8.5" ry="9.5" fill="#f2af95"/>
    <ellipse cx="126.5" cy="125.5" rx="3.2" ry="2.5" fill="#ffd7c3" opacity=".8"/>
    <path d="M111 141c11 10 28 10 39 0" stroke="#be5f70" stroke-width="4" stroke-linecap="round"/>

    <!-- beard and moustache -->
    <path d="M91 134c4 6 6 14 8 22 4 12 9 21 15 26 2 8 7 12 14 13 5 5 12 5 17 0 7-1 12-5 14-13 6-5 11-14 15-26 2-8 4-16 8-22-11 7-20 9-28 7-9 5-25 5-34 0-8 2-17 0-29-7z" fill="url(#fur)"/>
    <path d="M101 161c8 5 17 7 29 7 11 0 20-2 29-7" stroke="#d8e7ea" stroke-width="3.3" stroke-linecap="round"/>
    <path d="M130 136c-11-12-23-12-31-7-7 5-8 12-4 17 5 5 15 4 23-1 5-3 8-5 12-9z" fill="#fff"/>
    <path d="M130 136c11-12 23-12 31-7 7 5 8 12 4 17-5 5-15 4-23-1-5-3-8-5-12-9z" fill="#fff"/>
    <path d="M113 183c10 7 24 7 34 0" stroke="#e8f0f2" stroke-width="3" stroke-linecap="round"/>

    <!-- hat -->
    <path d="M84 97c7-32 27-55 52-61 28-7 54 6 67 28l16 8-9 14c-6-9-13-13-26-17-28-5-62 1-100 28z" fill="url(#cap)"/>
    <path d="M100 73c16-20 35-28 55-24 13 2 24 8 32 18" stroke="#ff8c98" stroke-width="4.5" stroke-linecap="round" opacity=".6"/>
    <path d="M81 100c27-14 65-20 97-14 9 1 16 4 20 7 3 4 2 9-1 12-4 4-7 5-11 4-31-10-59-5-88 5-7 3-13-1-16-5-4-4-4-8-1-9z" fill="#fff"/>
    <path d="M90 101c27-10 55-16 81-13" stroke="#e6eef0" stroke-width="3.2" stroke-linecap="round" opacity=".9"/>
    <circle cx="218" cy="84" r="17" fill="#fff"/>
    <circle cx="211" cy="78" r="7" fill="#fff" opacity=".94"/>

    <!-- holly bell detail -->
    <circle cx="95" cy="168" r="4.5" fill="#ffe282"/>
    <path d="M88 166c1-5 7-7 11-4M90 173c4 0 7-2 9-5" stroke="#2d8156" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>